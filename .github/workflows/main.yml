name: GadgetStore CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: timiscode/gadget
  CONTAINER_NAME: gadget
  HOST_PORT: 2301
  CONTAINER_PORT: 80
#updated today
jobs:
  #
  # ==========================================
  # 1. TEST APPLICATION
  # ==========================================
  test:
    name: Test React Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gadgetstore/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: gadgetstore

      - name: Run tests
        run: npm run test -- --run
        working-directory: gadgetstore

      - name: Build React application
        run: npm run build
        working-directory: gadgetstore


  # ==========================================
  # 2. BUILD & PUSH DOCKER IMAGE
  # ==========================================
  docker:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./gadgetstore
          file: ./gadgetstore/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

